<!doctype html>
<html lang="en">
<head>
  <base href="https://raw.githubusercontent.com/MasterPDiddy9/ProjectHNAR-HTML5/main/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project HNAR</title>
  <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="ProjectHNAR-HTML5-Shipping.css">
  <style>
    html, body { min-height: 100%; }
    #compilingmessage { z-index: 2; }
    .launcher-note { color: #ddd; text-align: center; margin: 8px auto; max-width: 900px; }
    #downloadProgressPanel { width: min(680px, calc(100vw - 40px)); margin: 0 auto 10px; text-align: left; white-space: normal; }
    #downloadProgressHeading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-weight: 600; }
    #downloadProgress .progress-bar { transition: width 150ms linear; }
    #downloadProgressBytes { text-align: center; font-size: 12px; }
  </style>
  <script src="jquery/jquery-2.1.3.min.js"></script>
  <script src="bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
  <div class="wrapper" id="mainarea">
    <div class="alert alert-warning centered-axis-xy" style="min-height:20px;display:none" role="alert" id="compilingmessage">
      <div id="downloadProgressPanel">
        <div id="downloadProgressHeading"><span id="downloadProgressLabel">Preparing download...</span><span id="downloadProgressPercent">0%</span></div>
        <div class="progress" id="downloadProgress" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="downloadProgressBar" class="progress-bar progress-bar-info progress-bar-striped active" style="width:0%"></div>
        </div>
        <div id="downloadProgressBytes">Waiting for the game files...</div>
      </div>
      <div id="loadTasks"></div>
    </div>
    <canvas tabindex="0" id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" style="display:none"></canvas>
  </div>
  <div class="buttonarea text-center" id="buttonarea">
    <button type="button" id="pause" class="btn btn-primary" onclick="try { Module.pauseMainLoop(); $('#resume').show().focus(); $('#pause').hide(); } catch(e) { console.error(e); }" title="Pause" style="display:none">Pause</button>
    <button type="button" id="resume" class="btn btn-primary" onclick="try { Module.resumeMainLoop(); $('#pause').show().focus(); $('#resume').hide(); } catch(e) { console.error(e); }" title="Resume" style="display:none">Resume</button>
    <button type="button" id="clear_indexeddb" class="btn btn-primary" onclick="try { deleteIndexedDBStorage(); } catch(e) { console.error(e); }" title="Clear browser cache" style="display:none">Clear browser cache</button>
    <button type="button" id="fullscreen_request" class="btn btn-primary" title="Fullscreen" style="display:none">Fullscreen</button>
  </div>
  <p class="launcher-note">This launcher loads the game files from GitHub. Keep this file and an internet connection available while playing.</p>
  <div class="texthalf text-normal jumbotron" id="logwindow" style="display:none"></div>

  <script>
    var Module = window.Module || {};
    Module.preRun = Module.preRun || [];

    function formatProgressBytes(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KiB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MiB';
    }

    var downloadProgressTimer = setInterval(function() {
      var progress = Module.assetDownloadProgress || {};
      var urls = Object.keys(progress);
      if (!urls.length) return;

      var current = 0;
      var total = 0;
      var finished = true;
      urls.forEach(function(url) {
        var item = progress[url];
        current += item.current || 0;
        total += item.total || 0;
        finished = finished && !!item.finished;
      });

      var percent = total ? Math.min(100, Math.floor(current * 100 / total)) : 0;
      document.getElementById('downloadProgressBar').style.width = percent + '%';
      document.getElementById('downloadProgressPercent').textContent = percent + '%';
      document.getElementById('downloadProgress').setAttribute('aria-valuenow', percent);
      document.getElementById('downloadProgressBytes').textContent = formatProgressBytes(current) + ' of ' + formatProgressBytes(total);
      document.getElementById('downloadProgressLabel').textContent = finished ? 'Downloads complete — preparing the game...' : 'Downloading game files';

      if (!document.getElementById('compilingmessage')) clearInterval(downloadProgressTimer);
    }, 200);

    Module.preRun.push(function() {
      Module._UE_SaveGame = function(slotNamePtr, userIndex, dataPtr, dataSize) {
        try {
          var slotName = UTF8ToString(slotNamePtr);
          var data = new Uint8Array(Module.HEAPU8.buffer, dataPtr, dataSize);
          var encoded = btoa(String.fromCharCode.apply(null, new Uint8Array(data)));
          localStorage.setItem('UESave_' + userIndex + '_' + slotName, encoded);
          console.log('[SaveGame] Saved slot:', slotName, 'size:', dataSize);
          return 1;
        } catch (e) { console.error('[SaveGame] Save failed:', e); return 0; }
      };
      Module._UE_LoadGame = function(slotNamePtr, userIndex, outDataPtrPtr, outDataSizePtr) {
        try {
          var slotName = UTF8ToString(slotNamePtr);
          var encoded = localStorage.getItem('UESave_' + userIndex + '_' + slotName);
          if (!encoded) return 0;
          var binary = atob(encoded);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var ptr = Module._malloc(bytes.length);
          Module.HEAPU8.set(bytes, ptr);
          Module.HEAP32[outDataPtrPtr >> 2] = ptr;
          Module.HEAP32[outDataSizePtr >> 2] = bytes.length;
          console.log('[SaveGame] Loaded slot:', slotName, 'size:', bytes.length);
          return 1;
        } catch (e) { console.error('[SaveGame] Load failed:', e); return 0; }
      };
    });

    (async function startGame() {
      var status = document.getElementById('compilingmessage');
      status.style.display = 'block';
      status.textContent = 'Connecting to the game files on GitHub...';
      try {
        var response = await fetch('ProjectHNAR-HTML5-Shipping.UE4.js');
        if (!response.ok) throw new Error('Could not download the game loader (HTTP ' + response.status + ').');
        var runtime = await response.text();
        runtime = runtime.replace(/\r\n/g, '\n');
        var fileProtocolCheck = "var isFileProtocol = name.indexOf('file://') != -1 || location.protocol.indexOf('file') != -1;";
        if (!runtime.includes(fileProtocolCheck)) throw new Error('The UE4 loader changed; this launcher needs an update.');
        runtime = runtime.replace(fileProtocolCheck, 'var isFileProtocol = false;');

        // Keep the save callbacks registered above when the UE4 loader initializes Module.
        if (!runtime.includes('var Module = {')) throw new Error('The UE4 module initializer changed; this launcher needs an update.');
        runtime = runtime.replace('var Module = {', 'var Module = Object.assign(window.Module || {}, {');
        var moduleInitEnd = /(UE4_indexedDBVersion:\s*[^,\n]+,[^\n]*\n)\};/;
        if (!moduleInitEnd.test(runtime)) throw new Error('The UE4 module initializer changed; this launcher needs an update.');
        runtime = runtime.replace(moduleInitEnd, '$1});');

        // Stream the large split data file so the progress bar moves while each 45 MiB part downloads.
        var partReadLine = 'var part = await response.arrayBuffer();';
        if (!runtime.includes(partReadLine)) throw new Error('The UE4 data downloader changed; this launcher needs an update.');
        var streamingPartRead = [
          'var partReader = response.body.getReader();',
          'var partChunks = [];',
          'var partLength = 0;',
          'while (true) {',
          '  var partResult = await partReader.read();',
          '  if (partResult.done) break;',
          '  partChunks.push(partResult.value);',
          '  partLength += partResult.value.byteLength;',
          '  reportDownloadProgress(url, loaded + partLength, total, false);',
          '}',
          'var part = new Uint8Array(partLength);',
          'var partOffset = 0;',
          'for (var chunkIndex = 0; chunkIndex < partChunks.length; chunkIndex++) {',
          '  part.set(partChunks[chunkIndex], partOffset);',
          '  partOffset += partChunks[chunkIndex].byteLength;',
          '}'
        ].join('\n');
        runtime = runtime.replace(partReadLine, streamingPartRead);

        var script = document.createElement('script');
        script.textContent = runtime;
        document.body.appendChild(script);
      } catch (error) {
        console.error(error);
        status.textContent = 'Could not start the game: ' + error.message;
      }
    })();
  </script>
</body>
</html>
