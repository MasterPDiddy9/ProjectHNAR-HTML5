<!doctype html>
<html lang="en">
<head>
  <base href="https://raw.githubusercontent.com/MasterPDiddy9/ProjectHNAR-HTML5/main/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project HNAR</title>
  <style>
    html, body { min-height: 100%; }
    #compilingmessage { z-index: 2; }
    .launcher-note { color: #ddd; text-align: center; margin: 8px auto; max-width: 900px; }
    #downloadProgressPanel { width: min(680px, calc(100vw - 40px)); margin: 0 auto 10px; text-align: left; white-space: normal; }
    #downloadProgressHeading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; font-weight: 600; }
    #downloadProgress .progress-bar { transition: width 150ms linear; }
    #downloadProgressBytes { text-align: center; font-size: 12px; }
    #saveControls { margin-top: 8px; }
    #saveMessage { display: inline-block; margin-left: 8px; color: #ddd; }
  </style>
</head>
<body>
  <div class="wrapper" id="mainarea">
    <div class="alert alert-warning centered-axis-xy" style="min-height:20px;display:none" role="alert" id="compilingmessage">
      <div id="downloadProgressPanel">
        <div id="downloadProgressHeading"><span id="downloadProgressLabel">Preparing download...</span><span id="downloadProgressPercent">0%</span></div>
        <div class="progress" id="downloadProgress" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="downloadProgressBar" class="progress-bar progress-bar-info progress-bar-striped active" style="width:0%"></div>
        </div>
        <div id="downloadProgressBytes">Waiting for the game files...</div>
      </div>
      <div id="loadTasks"></div>
    </div>
    <canvas tabindex="0" id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" style="display:none"></canvas>
  </div>
  <div class="buttonarea text-center" id="buttonarea">
    <button type="button" id="pause" class="btn btn-primary" onclick="try { Module.pauseMainLoop(); $('#resume').show().focus(); $('#pause').hide(); } catch(e) { console.error(e); }" title="Pause" style="display:none">Pause</button>
    <button type="button" id="resume" class="btn btn-primary" onclick="try { Module.resumeMainLoop(); $('#pause').show().focus(); $('#resume').hide(); } catch(e) { console.error(e); }" title="Resume" style="display:none">Resume</button>
    <button type="button" id="clear_indexeddb" class="btn btn-primary" onclick="try { deleteIndexedDBStorage(); } catch(e) { console.error(e); }" title="Clear browser cache" style="display:none">Clear browser cache</button>
    <button type="button" id="fullscreen_request" class="btn btn-primary" title="Fullscreen" style="display:none">Fullscreen</button>
    <span id="saveControls">
      <button type="button" id="exportSave" class="btn btn-primary">Export Save</button>
      <button type="button" id="importSave" class="btn btn-primary">Import Save</button>
      <input type="file" id="saveFileInput" accept=".json,application/json" style="display:none" aria-label="Choose a game save backup file">
      <span id="saveMessage" role="status" aria-live="polite"></span>
    </span>
  </div>
  <p class="launcher-note">This launcher loads the game files from GitHub. Keep this file and an internet connection available while playing. If the game is too dark, go to Settings and turn Shadows to Low.</p>
  <div class="texthalf text-normal jumbotron" id="logwindow" style="display:none"></div>

  <script>
    var Module = window.Module || {};
    Module.preRun = Module.preRun || [];

    (function setupSaveTransfer() {
      var savePrefix = 'UESave_';
      var status = document.getElementById('saveMessage');
      var fileInput = document.getElementById('saveFileInput');

      function isGameSaveKey(key) {
        return key.indexOf(savePrefix) === 0 || key === 'jStorage' || key === 'jStorage_update';
      }

      function getSaveEntries() {
        var entries = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && isGameSaveKey(key)) entries.push([key, localStorage.getItem(key)]);
        }
        return entries;
      }

      document.getElementById('exportSave').addEventListener('click', function() {
        try {
          var entries = getSaveEntries();
          if (!entries.length) {
            status.textContent = 'No game save data found in this browser.';
            return;
          }
          var backup = {
            format: 'projecthnar-save-backup',
            version: 1,
            exportedAt: new Date().toISOString(),
            saves: entries.map(function(entry) { return { key: entry[0], data: entry[1] }; })
          };
          var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          var url = URL.createObjectURL(blob);
          var link = document.createElement('a');
          link.href = url;
          link.download = 'ProjectHNAR-save-' + new Date().toISOString().slice(0, 10) + '.json';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
          status.textContent = 'Save backup downloaded.';
        } catch (error) {
          console.error('[Save transfer] Export failed:', error);
          status.textContent = 'Could not export the save: ' + error.message;
        }
      });

      document.getElementById('importSave').addEventListener('click', function() {
        fileInput.click();
      });

      fileInput.addEventListener('change', function() {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
          try {
            var backup = JSON.parse(reader.result);
            if (!backup || backup.format !== 'projecthnar-save-backup' || backup.version !== 1 || !Array.isArray(backup.saves) || !backup.saves.length) {
              throw new Error('This file is not a valid Project HNAR save backup.');
            }
            var imported = [];
            backup.saves.forEach(function(save) {
              if (!save || typeof save.key !== 'string' || !isGameSaveKey(save.key) || typeof save.data !== 'string') {
                throw new Error('The backup contains an invalid save slot.');
              }
              if (save.key.indexOf(savePrefix) === 0) {
                if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(save.data)) throw new Error('The backup contains invalid encoded save data.');
                atob(save.data);
              }
              if (imported.some(function(entry) { return entry[0] === save.key; })) throw new Error('The backup contains a duplicate save slot.');
              imported.push([save.key, save.data]);
            });

            var previous = getSaveEntries();
            var prompt = previous.length
              ? 'Import ' + imported.length + ' save item(s)? This replaces this game’s save data currently stored by this browser.'
              : 'Import ' + imported.length + ' save item(s) into this browser?';
            if (!window.confirm(prompt + ' The page will reload afterward so the game loads the imported saves.')) return;

            try {
              previous.forEach(function(entry) { localStorage.removeItem(entry[0]); });
              imported.forEach(function(entry) { localStorage.setItem(entry[0], entry[1]); });
            } catch (writeError) {
              getSaveEntries().forEach(function(entry) { localStorage.removeItem(entry[0]); });
              previous.forEach(function(entry) { localStorage.setItem(entry[0], entry[1]); });
              throw writeError;
            }

            status.textContent = 'Save imported. Reloading the game...';
            setTimeout(function() { window.location.reload(); }, 700);
          } catch (error) {
            console.error('[Save transfer] Import failed:', error);
            status.textContent = 'Could not import the save: ' + error.message;
          } finally {
            fileInput.value = '';
          }
        };
        reader.onerror = function() {
          status.textContent = 'Could not read that save backup file.';
          fileInput.value = '';
        };
        reader.readAsText(file);
      });
    })();

    function formatProgressBytes(bytes) {
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KiB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MiB';
    }

    var downloadProgressTimer = setInterval(function() {
      if (!document.getElementById('compilingmessage')) {
        clearInterval(downloadProgressTimer);
        return;
      }

      var progress = Module.assetDownloadProgress || {};
      var urls = Object.keys(progress);
      if (!urls.length) return;

      var current = 0;
      var total = 0;
      var finished = true;
      urls.forEach(function(url) {
        var item = progress[url];
        current += item.current || 0;
        total += item.total || 0;
        finished = finished && !!item.finished;
      });

      var percent = total ? Math.min(100, Math.floor(current * 100 / total)) : 0;
      document.getElementById('downloadProgressBar').style.width = percent + '%';
      document.getElementById('downloadProgressPercent').textContent = percent + '%';
      document.getElementById('downloadProgress').setAttribute('aria-valuenow', percent);
      document.getElementById('downloadProgressBytes').textContent = formatProgressBytes(current) + ' of ' + formatProgressBytes(total);
      document.getElementById('downloadProgressLabel').textContent = finished ? 'Downloads complete — preparing the game...' : 'Downloading game files';

    }, 200);

    Module.preRun.push(function() {
      Module._UE_SaveGame = function(slotNamePtr, userIndex, dataPtr, dataSize) {
        try {
          var slotName = UTF8ToString(slotNamePtr);
          var data = new Uint8Array(Module.HEAPU8.buffer, dataPtr, dataSize);
          var encoded = btoa(String.fromCharCode.apply(null, new Uint8Array(data)));
          localStorage.setItem('UESave_' + userIndex + '_' + slotName, encoded);
          console.log('[SaveGame] Saved slot:', slotName, 'size:', dataSize);
          return 1;
        } catch (e) { console.error('[SaveGame] Save failed:', e); return 0; }
      };
      Module._UE_LoadGame = function(slotNamePtr, userIndex, outDataPtrPtr, outDataSizePtr) {
        try {
          var slotName = UTF8ToString(slotNamePtr);
          var encoded = localStorage.getItem('UESave_' + userIndex + '_' + slotName);
          if (!encoded) return 0;
          var binary = atob(encoded);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          var ptr = Module._malloc(bytes.length);
          Module.HEAPU8.set(bytes, ptr);
          Module.HEAP32[outDataPtrPtr >> 2] = ptr;
          Module.HEAP32[outDataSizePtr >> 2] = bytes.length;
          console.log('[SaveGame] Loaded slot:', slotName, 'size:', bytes.length);
          return 1;
        } catch (e) { console.error('[SaveGame] Load failed:', e); return 0; }
      };
    });

    (async function startGame() {
      var statusPanel = document.getElementById('compilingmessage');
      var status = document.getElementById('downloadProgressLabel');
      var assetRoot = 'https://raw.githubusercontent.com/MasterPDiddy9/ProjectHNAR-HTML5/main/';

      async function getText(path) {
        var response = await fetch(new URL(path, assetRoot));
        if (!response.ok) throw new Error('Could not load ' + path + ' (HTTP ' + response.status + ').');
        return response.text();
      }

      function injectScript(source) {
        var script = document.createElement('script');
        script.textContent = source;
        document.body.appendChild(script);
      }

      async function injectStyle(path) {
        var cssUrl = new URL(path, assetRoot);
        var css = await getText(path);
        css = css.replace(/url\(([^)]+)\)/gi, function(match, value) {
          value = value.trim().replace(/^['"]|['"]$/g, '');
          if (/^(data:|https?:|\/\/|#)/i.test(value)) return match;
          return "url('" + new URL(value, cssUrl).href + "')";
        });
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
      }

      statusPanel.style.display = 'block';
      status.textContent = 'Connecting to the game files on GitHub...';
      try {
        await injectStyle('bootstrap/css/bootstrap.min.css');
        await injectStyle('ProjectHNAR1-HTML5-Shipping.css');
        injectScript(await getText('jquery/jquery-2.1.3.min.js'));
        injectScript(await getText('bootstrap/js/bootstrap.min.js'));
        var runtime = await getText('ProjectHNAR-HTML5-Shipping.UE4.js');
        runtime = runtime.replace(/\r\n/g, '\n');
        var fileProtocolCheck = "var isFileProtocol = name.indexOf('file://') != -1 || location.protocol.indexOf('file') != -1;";
        if (!runtime.includes(fileProtocolCheck)) throw new Error('The UE4 loader changed; this launcher needs an update.');
        runtime = runtime.replace(fileProtocolCheck, 'var isFileProtocol = false;');

        // Keep the save callbacks registered above when the UE4 loader initializes Module.
        if (!runtime.includes('var Module = {')) throw new Error('The UE4 module initializer changed; this launcher needs an update.');
        runtime = runtime.replace('var Module = {', 'var Module = Object.assign(window.Module || {}, {');
        var moduleInitEnd = /(UE4_indexedDBVersion:\s*[^,\n]+,[^\n]*\n)\};/;
        if (!moduleInitEnd.test(runtime)) throw new Error('The UE4 module initializer changed; this launcher needs an update.');
        runtime = runtime.replace(moduleInitEnd, '$1});');

        // This build's data archive exceeds GitHub's per-file limit, so fetch
        // the numbered chunks and decompress them before UE4 slices the package.
        var downloadStart = 'function download(url, responseType) {';
        if (!runtime.includes(downloadStart)) throw new Error('The UE4 data downloader changed; this launcher needs an update.');
        var xhrOpenLine = "xhr.open('GET', url, true);";
        if (!runtime.includes(xhrOpenLine)) throw new Error('The UE4 asset downloader changed; this launcher needs an update.');
        runtime = runtime.replace(xhrOpenLine, "xhr.open('GET', url + (url.indexOf('?') === -1 ? '?v=96d379c' : '&v=96d379c'), true);");
        var splitDataDownload = [
          downloadStart,
          "\tif (/ProjectHNAR1-HTML5-Shipping\\.data\\.gz(?:[?#]|$)/.test(url)) {",
          "\t\treturn (async function() {",
          "\t\t\tif (typeof DecompressionStream !== 'function') throw new Error('This browser does not support gzip decompression for split game data.');",
          "\t\t\tvar total = 1137187757;",
          "\t\t\tvar partCount = 25;",
          "\t\t\tvar loaded = 0;",
          "\t\t\tvar parts = [];",
          "\t\t\tvar baseUrl = new URL('ProjectHNAR-HTML5-Shipping.data.gz', new URL(url, document.baseURI)).href;",
          "\t\t\treportDownloadProgress(url, 0, total, false);",
          "\t\t\tfor (var i = 1; i <= partCount; i++) {",
          "\t\t\t\tvar partUrl = baseUrl + '.part' + String(i).padStart(2, '0');",
          "\t\t\t\tvar response = await fetch(partUrl);",
          "\t\t\t\tif (!response.ok) throw new Error('Failed to fetch game data part: ' + partUrl + ' (' + response.status + ')');",
          "\t\t\t\tvar part = await response.arrayBuffer();",
          "\t\t\t\tparts.push(part);",
          "\t\t\t\tloaded += part.byteLength;",
          "\t\t\t\treportDownloadProgress(url, loaded, total, i === partCount);",
          "\t\t\t}",
          "\t\t\tvar compressed = new Blob(parts);",
          "\t\t\tvar stream = compressed.stream().pipeThrough(new DecompressionStream('gzip'));",
          "\t\t\tvar bytes = await new Response(stream).arrayBuffer();",
          "\t\t\treturn responseType === 'blob' ? new Blob([bytes]) : bytes;",
          "\t\t})();",
          "\t}"
        ].join('\n');
        runtime = runtime.replace(downloadStart, splitDataDownload);

        var script = document.createElement('script');
        script.textContent = runtime;
        document.body.appendChild(script);
      } catch (error) {
        console.error(error);
        status.textContent = 'Could not start the game: ' + error.message;
      }
    })();
  </script>
</body>
</html>
